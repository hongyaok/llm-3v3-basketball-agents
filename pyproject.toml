[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bball3x3"
version = "0.1.0"
description = "llm multi-agent 3v3 basketball simulation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.0.0",
    "tenacity>=8.2.0",
    "numpy>=2.4.6",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "pandas>=2.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "lxml>=5.0.0",
    "jinja2>=3.1.0",
]

[project.scripts]
bball = "bball3x3.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "hypothesis>=6.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: manual tests against live OpenRouter API",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.3.0",
    "hypothesis>=6.0.0",
]
